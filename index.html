<style>

:root {

}

* { box-sizing: border-box; }

body { margin: 0; min-width: 320px; background: #fff; }

.site-shell { overflow: hidden; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: 10px; padding: 12px 16px; font-size: 13px; font-weight: 800; transition: transform .2s ease, box-shadow .2s ease, background .2s ease; }

.hero { position: relative; padding: 72px 0 48px; background: radial-gradient(circle at 19% 7%, rgba(207, 229, 255, .75), transparent 28%), linear-gradient(180deg, #f5f9ff 0%, #ffffff 92%); }
.hero::before { content: ''; position: absolute; width: 520px; height: 520px; border-radius: 50%; right: -250px; top: -260px; border: 1px solid rgba(75, 135, 234, .13); box-shadow: 0 0 0 32px rgba(75, 135, 234, .03), 0 0 0 64px rgba(75, 135, 234, .025); pointer-events: none; }

.hero h1 { margin: 18px 0 20px; max-width: 540px; color: #1f3056; font-size: clamp(42px, 5vw, 67px); line-height: 1.05; letter-spacing: -.068em; }
.hero h1 em { color: var(--blue); font-style: normal; }
.hero-copy { max-width: 480px; color: #687691; font-size: 16px; line-height: 1.75; }
.hero-cta { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-top: 30px; }

.demo-wrap { position: relative; }

.demo-topline { display: flex; align-items: center; justify-content: space-between; padding: 12px 15px; border-bottom: 1px solid #edf1f7; color: #8090a7; font-size: 10px; font-weight: 800; letter-spacing: .04em; }
.window-dots { display: flex; gap: 5px; }
.window-dots i { width: 7px; height: 7px; display: block; border-radius: 50%; background: #d6dfec; }
.window-dots i:first-child { background: #9abfff; }
.demo-body { display: grid; grid-template-columns: 1.15fr .85fr; min-height: 280px; }
.demo-panel { padding: 19px; }
.demo-panel + .demo-panel { border-left: 1px solid #edf1f7; background: #fbfdff; }
.panel-label { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; color: #94a0b2; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .11em; }
.panel-label strong { color: #6b7b94; font-size: 9px; }
.mini-code, .mini-output { margin: 0; color: #435577; font-family: monospace, ui-monospace, monospace; font-size: 11px; line-height: 1.85; white-space: pre-wrap; }
.mini-code .kw { color: #2563eb; }
.mini-code .var { color: #7c3aed; }

.mini-output { color: #4a628e; }
.mini-output::before { content: '>'; display: inline-block; margin-right: 8px; color: #54a4f8; font-weight: 800; }
.demo-status { display: inline-flex; align-items: center; gap: 6px; margin-top: 26px; padding: 6px 9px; border-radius: 7px; color: #258764; background: #e9faf3; font-size: 9px; font-weight: 800; }
.demo-status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #22b77d; }

.editor-section { position: relative; padding: 92px 0 108px; background: #fff; }
.section-intro { max-width: 650px; margin: 0 auto 36px; text-align: center; }
.eyebrow { margin: 0 0 13px; color: #4383e9; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
.section-intro h2 { margin: 0; color: #1f3056; font-size: clamp(30px, 4vw, 42px); letter-spacing: -.055em; line-height: 1.13; }
.section-intro p { margin: 16px auto 0; color: #718099; font-size: 14px; line-height: 1.75; }
.editor-shell { overflow: hidden; border: 1px solid #dce5f1; border-radius: 16px; background: #fff; box-shadow: 0 25px 70px rgba(31, 69, 129, .12); }
.editor-shell.fullscreen, .editor-shell:fullscreen { position: fixed; inset: 16px; z-index: 30; display: flex; flex-direction: column; width: auto; height: calc(100vh - 32px); min-height: 0; border-radius: 14px; box-shadow: 0 30px 100px rgba(24, 56, 112, .25); }
.editor-shell.fullscreen .editor-grid, .editor-shell:fullscreen .editor-grid { flex: 1; min-height: 0; }
.editor-shell.fullscreen .code-side, .editor-shell.fullscreen .output-side, .editor-shell:fullscreen .code-side, .editor-shell:fullscreen .output-side { display: flex; flex-direction: column; min-height: 0; }
.editor-shell.fullscreen .code-body, .editor-shell.fullscreen .output-body, .editor-shell:fullscreen .code-body, .editor-shell:fullscreen .output-body { flex: 1; height: auto; min-height: 0; }
.editor-shell.fullscreen .editor-footer, .editor-shell:fullscreen .editor-footer { flex: 0 0 auto; }
.editor-fullscreen { overflow: hidden; }
.editor-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 13px 16px; border-bottom: 1px solid #e7edf5; background: #fbfdff; }
.toolbar-left, .toolbar-actions { display: flex; align-items: center; gap: 8px; }
.fullscreen-btn { margin-left: 4px; }
.file-icon { width: 21px; height: 24px; display: grid; place-items: center; color: #5083cf; background: #edf5ff; border-radius: 5px; }
.file-name { color: #51627e; font-size: 12px; font-weight: 800; }
.readonly-badge { padding: 5px 7px; border: 1px solid #e2eaf4; border-radius: 6px; color: #8a98ac; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
.editor-grid { display: grid; grid-template-columns: minmax(0, 1.18fr) minmax(290px, .82fr); min-height: 430px; }
.code-side { min-width: 0; border-right: 1px solid #e8edf4; background: #fbfcfe; }
.code-head, .output-head { display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 19px; border-bottom: 1px solid #e8edf4; color: #7888a1; font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
.code-head span:last-child { color: #a1afc1; font-size: 9px; letter-spacing: .04em; text-transform: none; }
.code-body { display: grid; grid-template-columns: 48px minmax(0, 1fr); height: 385px; overflow: hidden; }
.line-numbers { overflow: hidden; padding: 18px 12px 18px 0; color: #b2bdcc; background: #f7f9fc; font: 12px/1.9 monospace, ui-monospace, monospace; text-align: right; user-select: none; }
.line-numbers .active { color: inherit; font-weight: inherit; }
.editor-canvas { position: relative; overflow: hidden; background: #fff; }
.highlight-layer, .code-input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 18px 19px; border: 0; outline: 0; font: 12px/1.9 monospace, ui-monospace, monospace; tab-size: 2; white-space: pre; }
.highlight-layer { overflow: auto; pointer-events: none; color: #455775; scrollbar-width: none; }
.highlight-layer::-webkit-scrollbar { display: none; }
.code-input { z-index: 2; overflow: auto; resize: none; color: transparent; background: transparent; caret-color: #2563eb; -webkit-text-fill-color: transparent; }
.code-input::selection { background: rgba(85, 145, 238, .2); }
.tok-keyword { color: #2563eb; font-weight: 500; }
.tok-variable { color: #7c3aed; }
.tok-number { color: #c26a16; }
.tok-string { color: #0a9366; }
.tok-operator { color: #9b4bb3; }
.tok-comment { color: #9aa7b7; font-style: italic; }
.output-side { min-width: 0; background: #fff; }
.output-head { background: #fbfdff; }
.output-head .live-dot { width: 6px; height: 6px; margin-right: 6px; display: inline-block; border-radius: 50%; background: #27b77d; box-shadow: 0 0 0 4px rgba(39,183,125,.1); }
.output-body { height: 385px; overflow: auto; padding: 21px; }
.output-terminal { min-height: 124px; padding: 15px; border: 1px solid #e5edf6; border-radius: 9px; background: #f9fbfe; color: #46618d; font: 12px/1.9 monospace, ui-monospace, monospace; white-space: pre-wrap; }
.output-placeholder { color: #9ba8b9; }
.output-line { display: block; }
.output-line::before { content: '›'; margin-right: 9px; color: #6caef4; }
.runtime-error { color: #c94d5e; }
.runtime-error::before { content: '!'; color: #e46b78; }
.variables { margin-top: 23px; }
.variables-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 11px; color: #8b99ad; font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.variables-title span { color: #b0bac8; font-size: 9px; letter-spacing: 0; text-transform: none; }
.variable-list { display: flex; flex-wrap: wrap; gap: 7px; }
.var-chip { padding: 7px 9px; border: 1px solid #e4eaf3; border-radius: 7px; color: #596b88; background: #fbfdff; font: 10px monospace, ui-monospace, monospace; }
.var-chip strong { color: #7c3aed; font-weight: 500; }
.editor-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 16px; border-top: 1px solid #e8edf4; background: #fbfdff; }
.status-text { display: inline-flex; align-items: center; gap: 7px; color: #74829a; font-size: 10px; font-weight: 700; }
.status-text::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #26b87d; }
.status-text.error { color: #c94d5e; }
.status-text.error::before { background: #e46b78; }

.features { padding: 96px 0 104px; background: #f7faff; }
.feature-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 42px; }
.feature-card { position: relative; min-height: 235px; padding: 27px; border: 1px solid #e1eaf5; border-radius: 14px; background: #fff; box-shadow: 0 9px 22px rgba(50, 90, 155, .035); }
.feature-card:nth-child(2) { transform: translateY(20px); }
.feature-icon { width: 42px; height: 42px; display: grid; place-items: center; margin-bottom: 26px; border-radius: 11px; }
.feature-card:nth-child(1) .feature-icon { color: #2e75dd; background: #eaf3ff; }
.feature-card:nth-child(2) .feature-icon { color: #8655da; background: #f1eaff; }
.feature-card:nth-child(3) .feature-icon { color: #10946b; background: #e6faf2; }
.feature-card h3 { margin: 0 0 10px; color: #2a3b5e; font-size: 15px; letter-spacing: -.02em; }
.feature-card p { margin: 0; color: #77859b; font-size: 12px; line-height: 1.75; }
.feature-index { position: absolute; right: 25px; top: 29px; color: #d0dbea; font: 11px monospace, ui-monospace, monospace; }

.support { padding: 85px 0 92px; text-align: center; }
.support h2 { margin: 0; color: #20345d; font-size: clamp(27px, 4vw, 40px); letter-spacing: -.06em; }
.support p { max-width: 500px; margin: 14px auto 24px; color: #738199; font-size: 14px; line-height: 1.7; }
.support-links { display: flex; justify-content: center; flex-wrap: wrap; gap: 11px; }
.support-link { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border: 1px solid #e3eaf3; border-radius: 9px; color: #597091; font-size: 12px; font-weight: 800; }
.support-link:hover { border-color: #b8d0f4; color: var(--blue); }
.footer { padding: 23px 0; border-top: 1px solid #edf1f6; }
.footer-inner { display: flex; align-items: center; justify-content: space-between; gap: 15px; color: #98a4b5; font-size: 10px; }
.footer-brand { color: #5c6e8d; font-weight: 800; }

.modal-backdrop { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 20px; background: rgba(26, 46, 80, .35); backdrop-filter: blur(5px); opacity: 0; pointer-events: none; transition: opacity .2s ease; }
.modal-backdrop.open { opacity: 1; pointer-events: auto; }
.modal { width: min(410px, 100%); padding: 28px; border: 1px solid #dfE8f4; border-radius: 17px; background: #fff; box-shadow: 0 24px 80px rgba(24, 57, 112, .22); transform: translateY(12px) scale(.98); transition: transform .2s ease; }
.modal-backdrop.open .modal { transform: translateY(0) scale(1); }
.modal-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.modal h3 { margin: 0; color: #20345d; font-size: 22px; letter-spacing: -.04em; }
.modal p { margin: 9px 0 21px; color: #77859b; font-size: 12px; line-height: 1.65; }
.close-btn { width: 29px; height: 29px; display: grid; place-items: center; border: 0; border-radius: 7px; color: #8c99ad; background: #f4f7fb; }
.form-label { display: block; margin: 0 0 7px; color: #526684; font-size: 11px; font-weight: 800; }
.form-input { width: 100%; padding: 12px 13px; border: 1px solid #dfe7f1; border-radius: 8px; outline: 0; color: #324766; font-size: 13px; }
.form-input:focus { border-color: #7eaff5; box-shadow: 0 0 0 3px rgba(76, 143, 241, .13); }
.modal .btn { width: 100%; margin-top: 14px; }
.modal-note { margin: 14px 0 0; color: #a0a9b8; text-align: center; font-size: 10px; }
.success-message { display: none; padding: 18px 15px; border-radius: 10px; color: #287b5c; background: #eafaf2; font-size: 12px; line-height: 1.6; }
.success-message.visible { display: block; }

@media (max-width: 900px) {
  .hero-grid { grid-template-columns: 1fr; gap: 48px; }
  .hero-copy { max-width: 600px; }
  .demo-card { max-width: 650px; margin: 0 auto; transform: none; }
}
@media (max-width: 700px) {
  .container { width: min(100% - 32px, 560px); }
  .topbar { padding: 17px 0; }
  .nav-right { gap: 12px; }
  .nav-link { display: none; }
  .hero { padding: 60px 0 34px; }
  .hero h1 { font-size: clamp(38px, 12vw, 55px); }
  .hero-copy { font-size: 14px; }
  .hero-cta .btn { width: 100%; }
  .demo-body { grid-template-columns: 1fr; }
  .demo-panel + .demo-panel { border-top: 1px solid #edf1f7; border-left: 0; }
  .editor-section { padding: 72px 0 78px; }
  .editor-toolbar { align-items: flex-start; flex-direction: column; }
  .toolbar-actions { width: 100%; }
  .toolbar-actions .btn { flex: 1; }
  .fullscreen-label { display: none; }
  .fullscreen-btn { flex: 0 0 42px !important; }
  .editor-shell.fullscreen, .editor-shell:fullscreen { inset: 8px; height: calc(100vh - 16px); }
  .editor-grid { grid-template-columns: 1fr; }
  .code-side { border-right: 0; border-bottom: 1px solid #e8edf4; }
  .output-side { min-height: 330px; }
  .feature-grid { grid-template-columns: 1fr; gap: 14px; }
  .feature-card:nth-child(2) { transform: none; }
  .features { padding: 73px 0 83px; }
  .support { padding: 70px 0 76px; }
  .footer-inner { align-items: flex-start; flex-direction: column; }
}

/* Prototype workspace: no promotional sections */
body { background: #f6f8fc; }
.editor-section { min-height: 100vh; padding: 24px 0 32px; background: #f6f8fc; }
.editor-section > .container { width: min(1500px, calc(100% - 40px)); }
.prototype-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; color: #20345d; font-size: 14px; }
.prototype-heading strong { font-size: 21px; letter-spacing: -.04em; }
.prototype-heading span { color: #74829c; font-size: 12px; }
.code-body, .output-body { height: min(70vh, 720px); min-height: 420px; }
@media (max-width: 700px) { .editor-section { padding: 14px 0; } .editor-section > .container { width: calc(100% - 20px); } .prototype-heading { align-items: flex-start; flex-direction: column; gap: 3px; } .code-body, .output-body { min-height: 300px; height: 350px; } }


/* Program input is part of the terminal stream, never a modal. */
.output-side { display:flex; flex-direction:column; min-height:0; }
.output-side > .output-body { flex:1 1 auto; min-height:160px; height:auto; overflow:auto; }
.problems-panel { flex:0 0 165px; min-height:115px; border-top:5px solid #e5e7eb; background:#fff; display:flex; flex-direction:column; }
.problems-head { padding:9px 14px; border-bottom:1px solid #e5e7eb; font-size:11px; font-weight:800; letter-spacing:.06em; color:#526684; display:flex; justify-content:space-between; }
.problems-content { flex:1; overflow:auto; margin:0; padding:12px 14px; white-space:pre-wrap; overflow-wrap:anywhere; color:#15803d; font:12px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace; }
.problems-content.has-error { color:#b91c1c; }
.program-status { font-size:11px; font-weight:800; letter-spacing:.05em; padding:4px 8px; border-radius:4px; }

.status-running { color:#92400e; background:#fef3c7; }
.status-complete { color:#047857; background:#ecfdf5; }
.status-error { color:#b91c1c; background:#fef2f2; }

.output-terminal { background: #fff; color: #17233c; font-size: 13px; }
/* Give the output console the available height; keep variable inspection compact. */
.output-side > .output-body { display:flex; flex-direction:column; flex:1 1 0; min-height:180px; padding:14px 16px; overflow:hidden; }
.output-side .output-terminal { flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:auto; }

.output-side > .variables .variables-title { margin:0 0 5px; font-size:9px; }
.output-side > .variables .variable-list { gap:5px; max-height:62px; overflow-y:auto; }

@media (max-width:700px) { .output-side > .output-body { min-height:240px; } .output-side > .variables .variable-list { max-height:52px; } }

.output-line::before { content: none; }
.inline-input-form { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin-top: 12px; padding: 10px 12px; background: #f8fafc; border: 1px solid #dbe5f1; border-radius: 9px; }
.inline-input-form label { font-weight: 600; color: #17233c; font-size: 12px; flex: 0 1 auto; }
.inline-input-form input { flex: 0 1 180px; width: 180px; max-width: 100%; min-width: 90px; box-sizing: border-box; border: 1px solid #9ca3af; border-radius: 5px; padding: 8px 10px; background: #fff; color: #111827; font: inherit; white-space: nowrap; overflow-x: auto; text-overflow: clip; }

const creditsDialog = document.querySelector('#creditsDialog');
const creditsLink = document.querySelector('#creditsLink');
document.querySelector('#creditsClose').addEventListener('click', () => creditsDialog.close());
creditsLink.addEventListener('click', () => creditsDialog.showModal());
creditsDialog.addEventListener('click', event => { if (event.target === creditsDialog) creditsDialog.close(); });

const codeInput = document.querySelector('#codeInput');
const highlightLayer = document.querySelector('#highlightLayer');
const lineNumbers = document.querySelector('#lineNumbers');
const outputTerminal = document.querySelector('#outputTerminal');
const programStatus = document.querySelector('#programStatus');
const problemsContent = document.querySelector('#problemsContent');
const problemCount = document.querySelector('#problemCount');
const variableList = document.querySelector('#variableList');
const statusText = document.querySelector('#statusText');
const debugHint = document.querySelector('#debugHint');
const editorShell = document.querySelector('.editor-shell');
const fullscreenBtn = document.querySelector('#fullscreenBtn');
let interpreterState = null;
let activeSource = starterCode;

codeInput.value = starterCode;

function escapeHtml(value) {
  return value.replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[character]));
}

function highlightCode(source) {
  return source.split('\n').map((line) => {
    if (/^\s*\/\//.test(line)) return `<span class="tok-comment">${escapeHtml(line)}</span>`;
    const tokens = /("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\b(?:DECLARE|INTEGER|REAL|STRING|BOOLEAN|FOR|TO|STEP|NEXT|IF|THEN|ELSE|ENDIF|OUTPUT|INPUT|MOD|AND|OR|NOT|TRUE|FALSE)\b|\b\d+(?:\.\d+)?\b|\b[A-Za-z_]\w*\b|←|<>|<=|>=|=|\+|-|\*|\/)/g;
    let result = '';
    let cursor = 0;
    let match;
    while ((match = tokens.exec(line))) {
      result += escapeHtml(line.slice(cursor, match.index));
      const value = match[0];
      let className = 'tok-variable';
      if (/^(?:"|')/.test(value)) className = 'tok-string';
      else if (/^\d/.test(value)) className = 'tok-number';
      else if (/^(?:DECLARE|INTEGER|REAL|STRING|BOOLEAN|FOR|TO|STEP|NEXT|IF|THEN|ELSE|ENDIF|OUTPUT|INPUT|MOD|AND|OR|NOT|TRUE|FALSE)$/.test(value)) className = 'tok-keyword';
      else if (/^(?:←|<>|<=|>=|=|\+|-|\*|\/)$/.test(value)) className = 'tok-operator';
      result += `<span class="${className}">${escapeHtml(value)}</span>`;
      cursor = match.index + value.length;
    }
    result += escapeHtml(line.slice(cursor));
    return result || ' ';
  }).join('\n');
}

function updateEditorView() {
  activeSource = codeInput.value;
  try {
    highlightLayer.innerHTML = highlightCode(activeSource);
  } catch (error) {
    // A highlighting failure must never conceal the original program.
    highlightLayer.textContent = activeSource;
  }
  const lines = activeSource.split('\n');
  lineNumbers.innerHTML = lines.map((_, index) => `<div>${index + 1}</div>`).join('');
  syncEditorScroll();
}

function syncEditorScroll() {
  highlightLayer.scrollTop = codeInput.scrollTop;
  highlightLayer.scrollLeft = codeInput.scrollLeft;
  lineNumbers.scrollTop = codeInput.scrollTop;
}

function setStatus(message, isError = false) {
  statusText.textContent = message;
  statusText.classList.toggle('error', isError);
}

function splitTopLevel(source, delimiter = ',') {
  const pieces = [];
  let start = 0;
  let depth = 0;
  let bracketDepth = 0;
  let quote = null;
  for (let i = 0; i < source.length; i += 1) {
    const char = source[i];
    if (quote) {
      if (char === quote && source[i - 1] !== '\\') quote = null;
      continue;
    }
    if (char === '"' || char === "'") quote = char;
    else if (char === '[') bracketDepth += 1;
    else if (char === ']') bracketDepth -= 1;
    else if (char === '(') depth += 1;
    else if (char === ')') depth -= 1;
    else if (char === delimiter && depth === 0 && bracketDepth === 0) {
      pieces.push(source.slice(start, i).trim());
      start = i + 1;
    }
  }
  pieces.push(source.slice(start).trim());
  return pieces.filter(Boolean);
}

function tokenizeExpression(source) {
  const tokens = [];
  let index = 0;
  while (index < source.length) {
    if (/\s/.test(source[index])) { index += 1; continue; }
    const rest = source.slice(index);
    const two = rest.slice(0, 2);
    if (['<>', '<=', '>='].includes(two)) { tokens.push({ type: 'op', value: two }); index += 2; continue; }
    const char = source[index];
    if ('(),+-*/%=<>'.includes(char)) { tokens.push({ type: 'op', value: char }); index += 1; continue; }
    if (char === '"' || char === "'") {
      let end = index + 1;

// Static parser: checks the complete expression grammar without evaluating student code.
function parseExpressionSyntax9618(source, line) {

// Structural validation is independent of the interpreter's execution path.
function structuralPreflight9618(source) {
  const lines=source.split(/\r?\n/), stack=[];
  const fail=(i,message)=>{const e=new Error(message);e.name='SyntaxError';e.sourceLine=i;throw e;};

  for(let i=0;i<lines.length;i++){
    const t=lines[i].trim();if(!t||t.startsWith('//'))continue;
    let m;
    if((m=t.match(/^IF\s+(.+)\s+THEN$/i))){parseExpressionSyntax9618(m[1],i);push('IF',i);continue;}
    if(/^ELSE$/i.test(t)){if(top()?.kind!=='IF'||top().elseSeen)fail(i,'ELSE without a matching IF or duplicate ELSE');top().elseSeen=true;continue;}
    if(/^ENDIF$/i.test(t)){close('IF',i);continue;}
    if(/^CONTINUE$/i.test(t)){if(!stack.some(frame=>['FOR','WHILE','REPEAT'].includes(frame.kind)))fail(i,'CONTINUE is only permitted inside a loop');continue;}
    if(/^BREAK$/i.test(t)){if(!stack.some(frame=>['FOR','WHILE','REPEAT'].includes(frame.kind)))fail(i,'BREAK is only permitted inside a loop');continue;}
    if((m=t.match(/^WHILE\s+(.+?)(?:\s+DO)?$/i))){parseExpressionSyntax9618(m[1],i);push('WHILE',i);continue;}
    if(/^ENDWHILE$/i.test(t)){close('WHILE',i);continue;}
    if(/^REPEAT$/i.test(t)){push('REPEAT',i);continue;}
    if((m=t.match(/^UNTIL\s+(.+)$/i))){if(top()?.kind!=='REPEAT')fail(i,'UNTIL without matching REPEAT');parseExpressionSyntax9618(m[1],i);stack.pop();continue;}

    if(/^ENDPROCEDURE$/i.test(t)){close('PROCEDURE',i);continue;}

    if((m=t.match(/^RETURN\s+(.+)$/i))){parseExpressionSyntax9618(m[1],i);continue;}

// Normalize typographic quotes only for parsing; the editor retains the source verbatim.
function normalizeSourceQuotes9618(source) {
  return source.replace(/[“”]/g, '"').replace(/[‘’]/g, "'");
}
function createValidatedState9618(source) {
  const originalSource = source;
  source = normalizeSourceQuotes9618(source);
  preflight9618(source);
  semanticPreflight9618(source);
  structuralPreflight9618(source);
  const state = createState(source.replace(/<--/g, '<-')); state.source = originalSource; return state;
}
function showCompileError9618(error) {
  const lines = codeInput.value.split(/\r?\n/);
  const match = String(error.message).match(/(?:on|at) line (\d+)/i);
  const line = Number.isInteger(error.sourceLine) ? error.sourceLine : match ? Number(match[1]) - 1 : 0;
  interpreterState = { source:codeInput.value, lines, activeLine:Math.max(0,line), vars:{}, output:[], done:true, error:error.message, errorType:error.name || 'SyntaxError' };
  renderState();
  setStatus(error.message,true);
}
function runProgram() {
  clearTimeout(liveDiagnosticTimer);
  try { interpreterState = createValidatedState9618(codeInput.value); } catch (error) { showCompileError9618(error); return; }
  continueProgram();
  renderState();
  if (interpreterState.pendingInput) { setStatus(`Input required for ${interpreterState.pendingInput.name}`); showProgramInput(); }
  else setStatus(interpreterState.error || 'Program completed successfully', Boolean(interpreterState.error));
}

function stepProgram() {
  clearTimeout(liveDiagnosticTimer);
  if (!interpreterState || interpreterState.source !== codeInput.value || interpreterState.done) {
    try { interpreterState = createValidatedState9618(codeInput.value); } catch (error) { showCompileError9618(error); return; }
  }
  if (!interpreterState.pendingInput) executeInstruction(interpreterState);
  if (!interpreterState.error && !interpreterState.pendingInput && interpreterState.pc >= interpreterState.lines.length) interpreterState.done = true;
  renderState();
  if (interpreterState.error) setStatus(interpreterState.error, true);
  else if (interpreterState.pendingInput) { setStatus(`Input required for ${interpreterState.pendingInput.name}`); showProgramInput(); }
  else if (interpreterState.done) setStatus('Program completed successfully');
  else setStatus(`Paused on line ${interpreterState.activeLine + 1}`);
}

function resetProgram() {
  codeInput.value = starterCode;
  clearTimeout(liveDiagnosticTimer);
  interpreterState = null;
  setStatus('Ready when you are');
  renderState();
  codeInput.focus();
}

// Live diagnostics are static-only: never run the student's program while typing.
let liveDiagnosticTimer = null;
function checkLiveSyntax9618() {
  liveDiagnosticTimer = null;
  try {
    preflight9618(normalizeSourceQuotes9618(codeInput.value));
    semanticPreflight9618(normalizeSourceQuotes9618(codeInput.value));
    structuralPreflight9618(codeInput.value);
    if (!interpreterState || interpreterState.source !== codeInput.value) {
      interpreterState = null;
      renderState();
    }
    setStatus('Unsaved changes');
  } catch (error) {
    // The compiler owns these diagnostics. Runtime failures are reported only by Run/Step.
    showCompileError9618(error);
  }
}
function scheduleLiveSyntax9618() {
  clearTimeout(liveDiagnosticTimer);
  interpreterState = null;
  updateEditorView();
  renderState();
  setStatus('Checking syntax...');
  liveDiagnosticTimer = setTimeout(checkLiveSyntax9618, 280);
}
codeInput.addEventListener('input', scheduleLiveSyntax9618);
codeInput.addEventListener('scroll', syncEditorScroll);
codeInput.addEventListener('keydown', (event) => {
  if (event.key === 'Tab') { event.preventDefault(); const start = codeInput.selectionStart; codeInput.value = `${codeInput.value.slice(0, start)}  ${codeInput.value.slice(codeInput.selectionEnd)}`; codeInput.selectionStart = codeInput.selectionEnd = start + 2; codeInput.dispatchEvent(new Event('input')); }
  if (event.shiftKey && event.key === 'Enter') { event.preventDefault(); runProgram(); }
});

const fileNameInput = document.querySelector('#programFileName');
function safeFileName() { return (fileNameInput.value.trim().replace(/[^A-Za-z0-9_.-]/g,'_').replace(/\.txt$/i,'') || 'index'); }
document.querySelector('#saveTxtBtn').addEventListener('click', () => {
  const blob = new Blob([codeInput.value], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a'); link.href=url; link.download=safeFileName()+'.txt';
  document.body.appendChild(link); link.click(); link.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
  setStatus('Saved '+safeFileName()+'.txt');
});
document.querySelector('#importTxtBtn').addEventListener('click',()=>document.querySelector('#importTxtInput').click());
document.querySelector('#importTxtInput').addEventListener('change',async event=>{
  const file=event.target.files?.[0]; if(!file)return;
  codeInput.value=await file.text(); fileNameInput.value=file.name.replace(/\.txt$/i,'');
  interpreterState=null; updateEditorView();renderState();scheduleLiveSyntax9618();setStatus('Imported '+file.name);event.target.value='';
});

document.querySelector('#runBtn').addEventListener('click', runProgram);
const resetDialog = document.querySelector('#resetDialog');
const resetNoPrompt = document.querySelector('#resetNoPrompt');
const resetPreferenceKey = 'utc2852.skipResetConfirmation';
function skipResetConfirmation() {
  try { return localStorage.getItem(resetPreferenceKey) === 'true'; } catch { return false; }
}
document.querySelector('#resetBtn').addEventListener('click', () => {
  if (skipResetConfirmation()) { resetProgram(); return; }
  resetNoPrompt.checked = false;
  resetDialog.showModal();
});
document.querySelector('#resetCancel').addEventListener('click', () => resetDialog.close());
document.querySelector('#resetConfirm').addEventListener('click', () => {
  if (resetNoPrompt.checked) {
    try { localStorage.setItem(resetPreferenceKey, 'true'); } catch { /* storage unavailable: confirmation remains enabled */ }
  }
  resetDialog.close();
  resetProgram();
});
function syncFullscreenState() {
  const isFullscreen = Boolean(document.fullscreenElement) || editorShell.classList.contains('fullscreen');
  editorShell.classList.toggle('fullscreen', isFullscreen);
  document.body.classList.toggle('editor-fullscreen', isFullscreen);
  fullscreenBtn.title = isFullscreen ? 'Exit fullscreen' : 'Open editor fullscreen';
  fullscreenBtn.setAttribute('aria-label', fullscreenBtn.title);
  fullscreenBtn.querySelector('.fullscreen-label').textContent = isFullscreen ? 'Exit' : 'Fullscreen';
  window.setTimeout(syncEditorScroll, 0);
}
fullscreenBtn.addEventListener('click', async () => {
  if (document.fullscreenElement) {
    await document.exitFullscreen?.();
  } else if (editorShell.requestFullscreen) {
    try { await editorShell.requestFullscreen(); } catch { editorShell.classList.toggle('fullscreen'); syncFullscreenState(); }
  } else {
    editorShell.classList.toggle('fullscreen');
    syncFullscreenState();
  }
});
document.addEventListener('fullscreenchange', syncFullscreenState);


updateEditorView();
renderState();

</script>
